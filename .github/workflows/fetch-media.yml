name: fetch-media
on:
  push:
    paths: ['fetch-list.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download files listed as "<path> <url>"
        run: |
          while read -r path url; do
            [ -z "$path" ] && continue
            mkdir -p "$(dirname "$path")"
            curl -fsSL -A "ig-media-fetch/1.0 (github actions)" -o "$path" "$url"
          done < fetch-list.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fetch media from fetch-list.txt"
          git push
