name: post
on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only test the Instagram connection (posts nothing)'
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Check connection only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/post.py --check
      - name: Watch the schedule and post each item at its slot
        if: ${{ github.event_name == 'schedule' || !inputs.check_only }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/post.py --serve-hours 5.4
      - name: Start the next watcher so coverage never has a gap
        if: ${{ always() && (github.event_name == 'schedule' || !inputs.check_only) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: sleep 60 && gh workflow run post.yml -f check_only=false
