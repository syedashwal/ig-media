name: Feed test
on: workflow_dispatch
permissions:
  issues: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=""
          for s in "GC=F" "BTC-USD" "%5ENDX"; do
            out="$out== $s"$'\n'"$(curl -s -m 20 -A 'Mozilla/5.0' "https://query1.finance.yahoo.com/v8/finance/chart/$s?interval=5m&range=1d" | head -c 300)"$'\n'
          done
          gh issue create -R "$GITHUB_REPOSITORY" -t "Feed test result" -b "$out"
