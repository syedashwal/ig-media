name: Fetch price data
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          curl -s -m 30 -A 'Mozilla/5.0' "https://query1.finance.yahoo.com/v8/finance/chart/GC=F?interval=1d&range=1y" -o data/gc-1d.json
          curl -s -m 30 -A 'Mozilla/5.0' "https://query1.finance.yahoo.com/v8/finance/chart/GC=F?interval=1h&range=1mo" -o data/gc-1h.json
          git config user.name "ig-media bot"; git config user.email "bot@users.noreply.github.com"
          git add data && git commit -m "Update price data" && git push || true
